<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>陆凯薇｜作品集二维码</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      background: #f5f5f2;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #111;
    }
    .card { text-align: center; max-width: 520px; }
    .eyebrow { letter-spacing: .28em; font-size: 12px; color: #747474; }
    .qr {
      display: block;
      width: min(78vw, 420px);
      height: auto;
      margin: 22px auto 18px;
      background: #fff;
      padding: 14px;
      border: 1px solid #e3e3de;
    }
    .title {
      font-size: 17px;
      letter-spacing: .14em;
      font-weight: 700;
    }
    .url {
      margin-top: 10px;
      font-size: 13px;
      color: #747474;
      word-break: break-all;
    }
    .back {
      display: inline-block;
      margin-top: 26px;
      font-size: 13px;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">SHORT VIDEO PORTFOLIO</p>
    <img class="qr" src="/qr.png" alt="作品集二维码" />
    <p class="title">SCAN TO VIEW PORTFOLIO</p>
    <p class="url" id="url">https://6ccb7766e03345d5a2847c4c8bafbf93.app.workbuddy.host</p>
    <a class="back" href="/">← BACK TO PORTFOLIO</a>
  </div>
  <script>
    // Reflect the real host so the printed URL always matches what was scanned.
    try {
      var u = window.location.origin;
      if (u) document.getElementById("url").textContent = u;
    } catch (e) {}
  </script>

<script>
(function(){
  try{
    var ua = navigator.userAgent.toLowerCase();
    if(ua.indexOf('micromessenger') === -1) return; // 仅在微信内置浏览器内提示
    var b = document.createElement('div');
    b.setAttribute('style','position:fixed;top:0;left:0;right:0;z-index:99999;background:#111;color:#fff;font-size:13px;line-height:1.5;padding:10px 14px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.3)');
    b.textContent='微信内打开可能受限 · 请点右上角 ··· 选择「在浏览器打开」查看完整作品集';
    document.body.appendChild(b);
    document.documentElement.style.scrollPaddingTop = '44px';
  }catch(e){}
})();
</script>

</body>
</html>
